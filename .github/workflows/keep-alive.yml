name: Keep Render awake

# Render's free tier spins a web service down after 15 minutes of inactivity,
# and the next visitor then waits ~50s for a cold start. Both services are
# pinged every 10 minutes to keep them warm.
#
# prism-api matters most: a GitHub webhook that arrives at a spun-down service
# waits for the cold start and can exceed GitHub's 10s delivery timeout, so the
# review never gets queued.
#
# The interval is 10 min rather than 14 because GitHub's scheduled runs can be
# delayed several minutes under load — that leaves margin against the 15-minute
# spin-down even when a run is late.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {} # allows a manual ping from the Actions tab

# A late run shouldn't pile up behind an in-flight one.
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ping both services
        env:
          # Render appends a random suffix when the plain service name is already
          # taken, so these are NOT prism-api/prism-web.onrender.com — those names
          # belong to another account and answer 503 (x-render-routing:
          # suspend-by-user). Pinging them kept every scheduled run red.
          # Override in repo Settings → Secrets and variables → Actions → Variables.
          PRISM_API_URL: ${{ vars.PRISM_API_URL || 'https://prism-api-wmam.onrender.com' }}
          PRISM_WEB_URL: ${{ vars.PRISM_WEB_URL || 'https://prism-web-fgts.onrender.com' }}
        run: |
          failed=0
          body="${RUNNER_TEMP:-/tmp}/ping-body"

          ping() {
            local name="$1" url="$2" code rc
            echo "Pinging $name at $url"
            # The body goes to a real file, not /dev/null: with --retry, curl
            # rewinds its output between attempts and exits 23 (write error) if
            # it cannot. Under `bash -e` that aborted the step before anything
            # was reported — a 503 surfaced as "exit code 23" and the second
            # service was never pinged at all.
            code=$(curl -sS -o "$body" -w '%{http_code}' \
                     --retry 3 --retry-all-errors --retry-delay 5 \
                     --max-time 150 "$url") && rc=0 || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::$name unreachable — curl exited $rc"
              failed=1
              return 0
            fi
            echo "  HTTP $code"
            # 2xx/3xx = awake. Anything else is reported so you get notified.
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "::error::$name returned $code"
              failed=1
            fi
          }

          # /health is the API's real probe: it checks the database and Redis,
          # so a 200 here means the worker can actually do its job.
          ping "prism-api" "${PRISM_API_URL}/health"
          ping "prism-web" "${PRISM_WEB_URL}/login"

          exit $failed
