name: CI

# The gates CLAUDE.md says every change must pass, enforced instead of
# remembered. Each package has its own lockfile and no workspace tooling, so
# each is its own job. None of them needs Postgres, Redis or any secret: the
# unit tests fake their stores, and nothing here deploys.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

# A newer push to the same PR makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: prism-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prism-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prism-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  web:
    name: prism-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prism-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prism-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  mcp:
    name: mcp-server
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      # No lockfile to cache or `npm ci` from: it is gitignored on purpose,
      # since this is a published package and users resolve its ranges fresh.
      # Installing the same way here audits what they would actually get.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Syntax check
        run: node --check index.js
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
